name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libudev-dev pkg-config

      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Check compilation
        run: cargo check --workspace --all-targets --locked --verbose

      - name: Enforce architecture boundaries
        if: runner.os == 'Linux'
        run: node scripts/check-architecture.mjs

      - name: Run portable contract and client tests
        run: cargo test -p pulsar-core -p pulsar-protocol -p pulsar-clients --locked --verbose

      - name: Run Linux engine and media contract tests
        if: runner.os == 'Linux'
        run: cargo test -p pulsar-engine --lib --locked --verbose

      # The full subprocess gate additionally requires delegated cgroup v2 and
      # bubblewrap. A hosted PR job is not evidence of worker confinement. Run
      # scripts/qualify-architecture.sh on the identified qualification host.
