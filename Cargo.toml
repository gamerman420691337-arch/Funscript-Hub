[workspace]
members = [
    "crates/pulsar-core",
    "crates/pulsar-protocol",
    "crates/pulsar-engine",
    "crates/pulsar-clients",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"

[package]
name = "pulsar"
version = "0.8.0"
edition = "2021"
authors = ["Pulsar Developers"]
description = "Pulsar: Neural Kinematic Workstation & Funscript Generator"
license = "AGPL-3.0-only"
default-run = "pulsar"

[[bin]]
name = "pulsar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
pulsar-core = { path = "crates/pulsar-core" }
pulsar-protocol = { path = "crates/pulsar-protocol" }
pulsar-engine = { path = "crates/pulsar-engine" }
pulsar-clients = { path = "crates/pulsar-clients" }

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
default = []
cuda = ["pulsar-engine/cuda"]
tensorrt = ["pulsar-engine/tensorrt", "cuda"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[target.'cfg(unix)'.dev-dependencies]
socket2 = "0.6.5"
