[package]
name = "pulsar-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Pure checked domain contracts and state transitions for Pulsar"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
