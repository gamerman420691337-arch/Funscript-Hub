[package]
name = "pulsar-clients"
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
eframe = "0.31"
pulsar-protocol = { path = "../pulsar-protocol" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.27"
